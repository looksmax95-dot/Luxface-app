<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Looksmax HARM 49</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#09090b;color:#f4f4f5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;height:100%;padding:8px;gap:8px}
.header{display:flex;justify-content:space-between;align-items:center;background:#18181b;padding:10px 14px;border-radius:10px;border:1px solid #27272a}
.title{font-size:14px;font-weight:700;color:#38bdf8;letter-spacing:.5px}
.badge-count{font-size:12px;background:#0284c7;color:#fff;padding:2px 8px;border-radius:12px;font-weight:600}
.step-banner{background:#18181b;padding:8px 12px;border-radius:8px;font-size:12px;color:#a1a1aa;border-left:3px solid #38bdf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewport{flex:1;position:relative;background:#000;border-radius:12px;overflow:hidden;border:1px solid #27272a;display:flex;align-items:center;justify-content:center}
canvas{touch-action:none;display:block}
.controls{display:flex;gap:8px}
button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:700;font-size:13px;background:#0284c7;color:#fff;cursor:pointer;transition:all .15s ease}
button:active{transform:scale(.98);opacity:.9}
button:disabled{background:#27272a;color:#52525b;cursor:not-allowed;transform:none}
.btn-undo{flex:0 0 50px;background:#27272a;color:#f4f4f5}
.btn-reset{flex:0 0 50px;background:#3f3f46;color:#f4f4f5}
#result-screen{display:none;position:fixed;inset:0;background:#09090b;z-index:100;overflow-y:auto;padding:16px}
.score-card{background:linear-gradient(135deg,#18181b 0%,#09090b 100%);border:1px solid #3f3f46;border-radius:16px;padding:20px;text-align:center;margin-bottom:16px}
.score-val{font-size:56px;font-weight:900;background:linear-gradient(to right,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tier-tag{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.t1{background:#052e16;color:#4ade80;border:1px solid #166534}
.t2{background:#172554;color:#60a5fa;border:1px solid #1e40af}
.t3{background:#451a03;color:#fbbf24;border:1px solid #92400e}
.t4{background:#450a0a;color:#f87171;border:1px solid #991b1b}
.metric-group{margin-bottom:16px}
.group-title{font-size:12px;font-weight:700;color:#71717a;text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px}
.metric-row{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.m-name{font-size:13px;font-weight:600}
.m-sub{font-size:11px;color:#71717a;margin-top:2px}
.m-badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.status-green{background:#052e16;color:#4ade80}
.status-yellow{background:#451a03;color:#fbbf24}
.status-red{background:#450a0a;color:#f87171}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <span class="title">LOOKSMAX HARM 49</span>
    <span class="badge-count" id="pt-count">0 / 49</span>
  </div>
  <div class="step-banner" id="step-txt">Загрузите четкое фото лица (анфас)</div>
  <div id="viewport"><canvas id="cvs"></canvas></div>
  <input type="file" id="file-inp" accept="image/*" style="display:none">
  <div class="controls">
    <button class="btn-reset" id="btn-reset" disabled>✕</button>
    <button class="btn-undo" id="btn-undo" disabled>↩</button>
    <button id="btn-main">📸 Загрузить фото</button>
  </div>
</div>

<div id="result-screen">
  <div class="score-card">
    <div style="font-size:12px;color:#a1a1aa;text-transform:uppercase;letter-spacing:1px">HARM Overall Index</div>
    <div class="score-val" id="res-score">0</div>
    <div class="tier-tag" id="res-tier">T5</div>
  </div>
  <div id="metrics-container"></div>
  <button id="btn-restart" style="width:100%;margin-top:12px;padding:14px">Сделать новый расчет</button>
</div>

<script>
const LM49=[
  "Верхняя точка лба","Левый висок","Правый висок","Левый угол челюсти","Правый угол челюсти",
  "Левая скула","Правая скула","Центр подбородка","Низ подбородка",
  "Внутр. угол левого глаза","Внеш. угол левого глаза","Центр левого зрачка",
  "Внутр. угол правого глаза","Внеш. угол правого глаза","Центр правого зрачка",
  "Левая бровь (старт)","Левая бровь (пик)","Левая бровь (хвост)",
  "Правая бровь (старт)","Правая бровь (пик)","Правая бровь (хвост)",
  "Межбровье","Верх переносицы",
  "Кончик носа","Субназале (низ носа)","Левое крыло носа","Правое крыло носа",
  "Левая ноздря","Правая ноздря","Спинка носа (верх)","Спинка носа (середина)",
  "Колумелла","Губной желобок",
  "Верхняя губа (Купидон лево)","Верхняя губа (Купидон право)","Центр верх. губы (низ)",
  "Левый угол рта","Правый угол рта","Нижняя губа (верх)","Нижняя губа (низ)",
  "Фильтрум (центр)","Левая подгубная складка","Правая подгубная складка",
  "Широкая точка левой скулы","Широкая точка правой скулы",
  "Граница верхней трети","Граница средней трети","Граница нижней трети","Адамово яблоко / Шея"
];

const tg=window.Telegram?.WebApp;
if(tg){tg.expand();tg.ready();}

const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
const fileInp=document.getElementById('file-inp'),btnMain=document.getElementById('btn-main');
const btnUndo=document.getElementById('btn-undo'),btnReset=document.getElementById('btn-reset');
const stepTxt=document.getElementById('step-txt'),ptCount=document.getElementById('pt-count');

let img=null,pts=[],scale=1,offX=0,offY=0;

btnMain.onclick=()=>{
  if(!img)fileInp.click();
  else if(pts.length===49)calcAndRenderHARM();
};

fileInp.onchange=(e)=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=(ev)=>{
    img=new Image();
    img.onload=()=>{
      pts=[];
      fitImage();
      draw();
      updateUI();
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
};

function fitImage(){
  const vp=document.getElementById('viewport');
  cvs.width=vp.clientWidth;
  cvs.height=vp.clientHeight;
  const sX=cvs.width/img.width, sY=cvs.height/img.height;
  scale=Math.min(sX,sY);
  offX=(cvs.width-img.width*scale)/2;
  offY=(cvs.height-img.height*scale)/2;
}

cvs.addEventListener('pointerdown',(e)=>{
  if(!img||pts.length>=49)return;
  const rect=cvs.getBoundingClientRect();
  const clX=e.clientX-rect.left, clY=e.clientY-rect.top;
  const imgX=(clX-offX)/scale, imgY=(clY-offY)/scale;
  if(imgX>=0&&imgX<=img.width&&imgY>=0&&imgY<=img.height){
    pts.push({x:imgX,y:imgY});
    updateUI();
    draw();
  }
});

btnUndo.onclick=()=>{if(pts.length>0){pts.pop();updateUI();draw();}};
btnReset.onclick=()=>{pts=[];updateUI();draw();};
document.getElementById('btn-restart').onclick=()=>{
  document.getElementById('result-screen').style.display='none';
  pts=[];img=null;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  updateUI();
};

function updateUI(){
  ptCount.innerText=`${pts.length} / 49`;
  btnUndo.disabled=pts.length===0;
  btnReset.disabled=pts.length===0;
  if(!img){
    stepTxt.innerText="Загрузите четкое фото лица (анфас)";
    btnMain.innerText="📸 Загрузить фото";
    btnMain.disabled=false;
  }else if(pts.length<49){
    stepTxt.innerText=`Точка ${pts.length+1}: ${LM49[pts.length]}`;
    btnMain.innerText="Поставьте все точки";
    btnMain.disabled=true;
  }else{
    stepTxt.innerText="Все 49 точек успешно установлены!";
    btnMain.innerText="📊 Посчитать индекс HARM";
    btnMain.disabled=false;
  }
}

function draw(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  if(!img)return;
  ctx.drawImage(img,offX,offY,img.width*scale,img.height*scale);
  pts.forEach((p,i)=>{
    const scrX=offX+p.x*scale, scrY=offY+p.y*scale;
    ctx.beginPath();
    ctx.arc(scrX,scrY,idxLast(i)?6:4,0,Math.PI*2);
    ctx.fillStyle=idxLast(i)?'#38bdf8':'#0284c7';
    ctx.fill();
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    ctx.stroke();
  });
}
function idxLast(i){return i===pts.length-1;}

const d=(p1,p2)=>Math.hypot(p2.x-p1.x,p2.y-p1.y);
const ang=(p1,p2)=>Math.atan2(p2.y-p1.y,p2.x-p1.x)*(180/Math.PI);

function calcAndRenderHARM(){
  const intercanthal=d(pts[9],pts[12]);
  const eyeL=d(pts[9],pts[10]), eyeR=d(pts[12],pts[13]);
  const avgEye=(eyeL+eyeR)/2;
  const cheekW=d(pts[43],pts[44]);
  const jawW=d(pts[3],pts[4]);
  const noseW=d(pts[25],pts[26]);
  const midFaceH=d(pts[21],pts[36]);
  const cTilt=Math.abs(ang(pts[9],pts[10]));

  const metrics=[
    {name:"ESR (Eye Separation)",grp:"Harmony",val:intercanthal/avgEye,ideal:1.0,w:0.3},
    {name:"FWHR (Width-to-Height)",grp:"Angularity",val:cheekW/midFaceH,ideal:1.9,w:0.25},
    {name:"Jaw-to-Cheek Ratio",grp:"Dimorphism",val:jawW/cheekW,ideal:0.86,w:0.25},
    {name:"Nose-to-Intercanthal",grp:"Misc",val:noseW/intercanthal,ideal:1.0,w:0.2}
  ];

  let totalScore=0;
  const processed=metrics.map(m=>{
    let dev=Math.abs((m.val-m.ideal)/m.ideal)*100;
    let score=Math.max(0,100-dev*2.2);
    totalScore+=score*m.w;
    let st=dev<=6?'status-green':(dev<=16?'status-yellow':'status-red');
    return {...m,dev:dev.toFixed(1),val:m.val.toFixed(2),st};
  });

  const finalScore=Math.round(totalScore);
  let tier={txt:"T5 (Sub-Average)",cls:"t4"};
  if(finalScore>=86)tier={txt:"T1 (Chiseled / Model)",cls:"t1"};
  else if(finalScore>=74)tier={txt:"T2 (High Harmony)",cls:"t2"};
  else if(finalScore>=62)tier={txt:"T3 (Mid Tier)",cls:"t3"};
  else if(finalScore>=50)tier={txt:"T4 (Low Harmony)",cls:"t4"};

  document.getElementById('res-score').innerText=finalScore;
  const tEl=document.getElementById('res-tier');
  tEl.innerText=tier.txt;
  tEl.className=`tier-tag ${tier.cls}`;

  let html='';
  processed.forEach(m=>{
    html+=`<div class="metric-row">
      <div>
        <div class="m-name">${m.name}</div>
        <div class="m-sub">Факт: ${m.val} | Идеал: ${m.ideal}</div>
      </div>
      <div class="m-badge ${m.st}">${m.dev}% dev</div>
    </div>`;
  });
  document.getElementById('metrics-container').innerHTML=html;
  document.getElementById('result-screen').style.display='block';
}
</script>
</body>
</html>
