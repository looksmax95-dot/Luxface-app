<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg1:#0b0f1a; --bg2:#141a2e;
  --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.1);
  --txt:#f2f5fa; --mut:#93a0b4;
  --acc:#5b8cff; --acc2:#8b5bff;
  --ok:#3ddc84; --warn:#ffd166; --bad:#ff5c7a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);
  font:15px/1.45 -apple-system,Roboto,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
#home{overflow-y:auto;padding:20px}
h1{font-size:24px;font-weight:800;margin:2px 0;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:16px;margin-bottom:14px}
input[type=file]{width:100%;color:var(--mut)}
select{background:#1b2233;color:var(--txt);border:1px solid var(--line);
  border-radius:10px;padding:9px}
#editor{background:#000}
#cv{position:absolute;inset:0;touch-action:none}
#top{position:absolute;top:0;left:0;right:0;padding:12px 14px;z-index:5;
  background:linear-gradient(#000d,#0000)}
#pname{font-weight:800;font-size:16px}
#pdesc{color:#cdd6e4;font-size:12.5px;margin-top:2px}
#guide{position:absolute;left:10px;top:70px;width:100px;height:126px;
  background:#0009;border:1px solid var(--line);border-radius:14px;z-index:5}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  display:flex;gap:8px;z-index:6;background:linear-gradient(#0000,#000d)}
#bar button{flex:1;border:0;border-radius:14px;padding:13px 0;font-size:17px;
  color:#fff;background:#1b2233cc;border:1px solid var(--line)}
#bar button.main{flex:2;background:linear-gradient(90deg,var(--acc),var(--acc2));font-weight:800}
#result{overflow:hidden}
#rcv{width:100%;height:42vh;background:#000;flex:none}
#mlist{flex:1;overflow-y:auto;padding:12px 16px 90px}
.mrow{padding:10px 2px;border-bottom:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.gauge{position:relative;height:9px;border-radius:6px;margin:7px 0 3px}
.gauge i{position:absolute;top:-3px;width:4px;height:15px;background:#fff;
  border-radius:2px;box-shadow:0 0 8px #fff}
.chip{padding:2px 10px;border-radius:20px;font-weight:800;font-size:12px}
#send{position:fixed;left:16px;right:16px;bottom:12px;border:0;border-radius:14px;
  padding:15px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:9}
</style>
</head>
<body>

<div class="screen" id="home">
  <h1>LUX FACE PRO</h1>
  <div class="sub">Ручные точки → расчёт + презентация линиями на фото.</div>
  <div class="card">
    <div class="sub" style="margin-bottom:8px">1 · Фото АНФАС: ровно, без улыбки, лоб открыт</div>
    <input type="file" id="file" accept="image/*">
  </div>
  <div class="card">
    <label class="sub">Строгость (p)</label><br>
    <select id="p">
      <option>1</option><option>0.5</option><option>0.3</option>
      <option selected>0.2</option><option>0</option><option>-1</option>
    </select>
    <div class="sub" style="margin-top:8px">p=1 мягко · 0.2 баланс · −1 беспощадно</div>
  </div>
  <div class="card sub" style="margin:0">
    2 · Тяни фото пальцем, зум +/−, наводи крестик → <b>ТОЧКА</b>. ⟲ — отменить. Слева схема-подсказка.
  </div>
</div>

<div class="screen" id="editor" style="display:none">
  <canvas id="cv"></canvas>
  <div id="top"><div id="pname"></div><div id="pdesc"></div></div>
  <canvas id="guide" width="100" height="126"></canvas>
  <div id="bar">
    <button id="undo">⟲</button>
    <button id="zout">−</button>
    <button id="zin">+</button>
    <button class="main" id="placeBtn">ТОЧКА</button>
  </div>
</div>

<div class="screen" id="result" style="display:none">
  <canvas id="rcv"></canvas>
  <div id="mlist"></div>
  <button id="send">Отправить боту</button>
</div>

<script>
"use strict";

/* ---------- Telegram + звук + вибрация ---------- */
var TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); }

function haptic() {
  if (TG && TG.HapticFeedback) TG.HapticFeedback.impactOccurred('light');
}
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur) {
  try {
    var a = ensureAudio();
    var o = a.createOscillator();
    var g = a.createGain();
    o.frequency.value = freq;
    g.gain.value = 0.12;
    o.connect(g); g.connect(a.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.stop(a.currentTime + dur);
  } catch (e) {}
}
function soundPlace() { tone(880, 0.07); }
function soundUndo()  { tone(320, 0.08); }
function soundDone()  {
  [523, 659, 784, 1046].forEach(function (f, i) {
    setTimeout(function () { tone(f, 0.12); }, i * 90);
  });
}

/* ---------- DOM ---------- */
function byId(id) { return document.getElementById(id); }
var elHome = byId('home'), elEditor = byId('editor'), elResult = byId('result');
var elFile = byId('file'), elP = byId('p');
var elCv = byId('cv'), ctx = elCv.getContext('2d');
var elName = byId('pname'), elDesc = byId('pdesc');
var elGuide = byId('guide'), gctx = elGuide.getContext('2d');
var elUndo = byId('undo'), elZin = byId('zin'), elZout = byId('zout'), elPlace = byId('placeBtn');
var elRcv = byId('rcv'), rctx = elRcv.getContext('2d');
var elList = byId('mlist'), elSend = byId('send');

/* ---------- 65 точек: [ключ, имя, подсказка, x, y на схеме] ---------- */
var POINTS = [
["hair","Линия роста волос","середина лба у волос",.5,.06],
["hairR","Волосы прав.","край линии справа",.32,.10],
["hairL","Волосы лев.","край линии слева",.68,.10],
["hairR2","Волосы прав.2","выше виска",.22,.14],
["hairL2","Волосы лев.2","выше виска",.78,.14],
["glab","Глабелла","между бровями",.5,.33],
["foreR","Лоб прав.","середина справа",.30,.24],
["foreL","Лоб лев.","середина слева",.70,.24],
["foreMR","Лоб сред прав.","",.40,.20],
["foreML","Лоб сред лев.","",.60,.20],
["tempR","Висок прав.","край лба",.16,.32],
["tempL","Висок лев.","край лба",.84,.32],
["browRi","Бровь прав. внутр.","у переносицы",.36,.36],
["browRp","Бровь прав. пик","верх брови",.32,.34],
["browRo","Бровь прав. внешн.","хвост",.22,.36],
["browLi","Бровь лев. внутр.","у переносицы",.64,.36],
["browLp","Бровь лев. пик","верх брови",.68,.34],
["browLo","Бровь лев. внешн.","хвост",.78,.36],
["eyeRo","Глаз прав. внешн.","внешний уголок",.24,.45],
["eyeRi","Глаз прав. внутр.","внутренний уголок",.40,.45],
["eyeRu","Прав. верх. веко","середина",.32,.43],
["eyeRl","Прав. ниж. веко","середина",.32,.47],
["eyeRc","Прав. зрачок","центр",.32,.45],
["eyeLo","Глаз лев. внешн.","внешний уголок",.76,.45],
["eyeLi","Глаз лев. внутр.","внутренний уголок",.60,.45],
["eyeLu","Лев. верх. веко","середина",.68,.43],
["eyeLl","Лев. ниж. веко","середина",.68,.47],
["eyeLc","Лев. зрачок","центр",.68,.45],
["undR","Под глазом прав.","нижний край орбиты",.32,.50],
["undL","Под глазом лев.","нижний край орбиты",.68,.50],
["nas","Назион","переносица",.5,.42],
["nbr","Спинка носа","середина спинки",.5,.50],
["ntip","Кончик носа","выступающая точка",.5,.60],
["noseR","Крыло прав.","край ноздри",.42,.62],
["noseL","Крыло лев.","край ноздри",.58,.62],
["sub","Субназале","основание носа",.5,.66],
["mouR","Рот прав. уголок","",.34,.76],
["mouL","Рот лев. уголок","",.66,.76],
["lt","Верхняя губа","лук Купидона",.5,.73],
["st","Линия губ","стык по центру",.5,.76],
["lb","Низ нижней губы","",.5,.80],
["bizUpR","Ширина верх прав.","",.15,.44],
["bizUpL","Ширина верх лев.","",.85,.44],
["bizR","Ширина прав.","максимум ширины",.13,.50],
["bizL","Ширина лев.","максимум ширины",.87,.50],
["bizLowR","Ширина низ прав.","",.16,.58],
["bizLowL","Ширина низ лев.","",.84,.58],
["zygR","Скула прав.","выступающая точка",.18,.57],
["zygL","Скула лев.","выступающая точка",.82,.57],
["chkR","Щёка прав.","середина",.26,.64],
["chkL","Щёка лев.","середина",.74,.64],
["holR","Впадина прав.","под скулой",.30,.70],
["holL","Впадина лев.","под скулой",.70,.70],
["jawUpR","Челюсть верх прав.","",.20,.72],
["jawUpL","Челюсть верх лев.","",.80,.72],
["gonR","Угол челюсти прав.","нижний угол",.24,.80],
["gonL","Угол челюсти лев.","нижний угол",.76,.80],
["jawMidR","Челюсть сред прав.","",.32,.89],
["jawMidL","Челюсть сред лев.","",.68,.89],
["jawLowR","Челюсть низ прав.","",.41,.94],
["jawLowL","Челюсть низ лев.","",.59,.94],
["chin","Подбородок","самая нижняя точка",.5,.97],
["neckR","Шея прав.","",.32,1.0],
["neckL","Шея лев.","",.68,1.0]
];

/* ---------- состояние ---------- */
var img = null, placed = [], idx = 0, PVAL = 0.2;
var view = { s: 1, ox: 0, oy: 0 };
var dpr = window.devicePixelRatio || 1, cw = 0, ch = 0;
var METRICS = [], PTS = {}, overall = 0, psl = 1, thirds = [0,0,0];

/* ---------- старт ---------- */
elFile.onchange = function (e) {
  var f = e.target.files[0];
  if (!f) return;
  ensureAudio();
  PVAL = parseFloat(elP.value);
  var r = new FileReader();
  r.onload = function (ev) {
    img = new Image();
    img.onload = startEditor;
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
};

function startEditor() {
  elHome.style.display = 'none';
  elEditor.style.display = 'block';
  resizeCanvas();
  placed = []; idx = 0;
  fitImage();
  updatePointUI();
  drawEditor();
}
function resizeCanvas() {
  cw = window.innerWidth; ch = window.innerHeight;
  elCv.width = cw * dpr; elCv.height = ch * dpr;
  elCv.style.width = cw + 'px'; elCv.style.height = ch + 'px';
}
function fitImage() {
  view.s = Math.min(cw / img.width, ch / img.height) * 0.9;
  view.ox = (cw - img.width * view.s) / 2;
  view.oy = (ch - img.height * view.s) / 2;
}
function updatePointUI() {
  var p = POINTS[idx];
  elName.textContent = (idx + 1) + "/" + POINTS.length + " · " + p[1];
  elDesc.textContent = p[2] ? ("Куда: " + p[2]) : "Наведи крестик на точку";
  drawGuide();
}
function drawGuide() {
  gctx.clearRect(0, 0, 100, 126);
  gctx.strokeStyle = '#4a5570'; gctx.lineWidth = 1.5;
  gctx.beginPath(); gctx.ellipse(50, 66, 36, 56, 0, 0, 7); gctx.stroke();
  gctx.beginPath(); gctx.ellipse(32, 56, 9, 4, 0, 0, 7); gctx.stroke();
  gctx.beginPath(); gctx.ellipse(68, 56, 9, 4, 0, 0, 7); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(50, 60); gctx.lineTo(50, 78); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(38, 96); gctx.quadraticCurveTo(50, 100, 62, 96); gctx.stroke();
  var t = POINTS[idx], x = t[3] * 100, y = t[4] * 126;
  gctx.fillStyle = '#ff5c7a';
  gctx.beginPath(); gctx.arc(x, y, 4, 0, 7); gctx.fill();
  gctx.globalAlpha = 0.5; gctx.strokeStyle = '#ff5c7a';
  gctx.beginPath(); gctx.arc(x, y, 8, 0, 7); gctx.stroke();
  gctx.globalAlpha = 1;
}
function drawEditor() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  for (var i = 0; i < placed.length; i++) {
    var p = placed[i];
    var x = p.x * img.width * view.s + view.ox;
    var y = p.y * img.height * view.s + view.oy;
    ctx.fillStyle = '#3ddc84';
    ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '10px sans';
    ctx.fillText(i + 1, x + 6, y - 6);
  }
  ctx.strokeStyle = '#3ddc84'; ctx.lineWidth = 1.5;
  ctx.shadowColor = '#3ddc84'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(cw / 2 - 16, ch / 2); ctx.lineTo(cw / 2 + 16, ch / 2);
  ctx.moveTo(cw / 2, ch / 2 - 16); ctx.lineTo(cw / 2, ch / 2 + 16);
  ctx.stroke(); ctx.shadowBlur = 0;
}

/* ---------- точки ---------- */
function placePoint() {
  placed.push({
    x: ((cw / 2) - view.ox) / view.s / img.width,
    y: ((ch / 2) - view.oy) / view.s / img.height
  });
  haptic(); soundPlace();
  idx++;
  if (idx >= POINTS.length) finish();
  else { updatePointUI(); drawEditor(); }
}
function undoPoint() {
  if (idx > 0) { idx--; placed.pop(); haptic(); soundUndo(); updatePointUI(); drawEditor(); }
}
elPlace.addEventListener('click', placePoint);
elUndo.addEventListener('click', undoPoint);
elZin.addEventListener('click', function () { view.s = Math.min(30, view.s * 1.3); drawEditor(); });
elZout.addEventListener('click', function () { view.s = Math.max(0.05, view.s / 1.3); drawEditor(); });

/* ---------- pan + pinch ---------- */
var ptrs = new Map(), pan = null, pinch = null;
elCv.addEventListener('pointerdown', function (e) {
  elCv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) pan = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy };
  else if (ptrs.size === 2) {
    var a = Array.from(ptrs.values());
    pinch = { d: Math.hypot(a[0][0]-a[1][0], a[0][1]-a[1][1]), s: view.s };
  }
});
elCv.addEventListener('pointermove', function (e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1 && pan) {
    view.ox = pan.ox + e.clientX - pan.x;
    view.oy = pan.oy + e.clientY - pan.y;
  } else if (ptrs.size === 2 && pinch) {
    var a = Array.from(ptrs.values());
    var d = Math.hypot(a[0][0]-a[1][0], a[0][1]-a[1][1]);
    view.s = Math.max(0.05, Math.min(30, pinch.s * d / pinch.d));
  }
  drawEditor();
});
elCv.addEventListener('pointerup', function (e) {
  ptrs.delete(e.pointerId);
  if (ptrs.size === 1) {
    var a = Array.from(ptrs.values())[0];
    pan = { x: a[0], y: a[1], ox: view.ox, oy: view.oy };
    pinch = null;
  } else if (ptrs.size === 0) pan = null;
});

/* ---------- математика ---------- */
function score(v, lo, hi, m) {
  if (v >= lo && v <= hi) return 100;
  var d = v < lo ? lo - v : v - hi;
  return Math.max(0, 100 - 100 * d / m);
}
function pmean(xs, p) {
  xs = xs.map(function (x) { return Math.max(0.1, x); });
  if (Math.abs(p) < 1e-9)
    return Math.exp(xs.reduce(function (a, x) { return a + Math.log(x); }, 0) / xs.length);
  return Math.pow(xs.reduce(function (a, x) { return a + Math.pow(x, p); }, 0) / xs.length, 1 / p);
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angleAt(a, b, c) {
  var v1 = [a.x-b.x, a.y-b.y], v2 = [c.x-b.x, c.y-b.y];
  var n = Math.hypot(v1[0], v1[1]) * Math.hypot(v2[0], v2[1]);
  if (!n) return 0;
  var cos = Math.max(-1, Math.min(1, (v1[0]*v2[0] + v1[1]*v2[1]) / n));
  return Math.acos(cos) * 180 / Math.PI;
}
function colorOf(s) { return s >= 80 ? '#3ddc84' : s >= 50 ? '#ffd166' : '#ff5c7a'; }
function gauge(v, lo, hi, m) {
  var k = 3, rl = lo - k * m, rh = hi + k * m;
  var pos = Math.max(0, Math.min(1, (v - rl) / (rh - rl)));
  var gs = (lo - rl) / (rh - rl) * 100, ge = (hi - rl) / (rh - rl) * 100;
  return {
    pos: (pos * 100).toFixed(1),
    grad: 'linear-gradient(90deg,var(--bad) 0%,var(--warn) ' + (gs*0.5).toFixed(1) + '%,var(--ok) '
      + gs.toFixed(1) + '%,var(--ok) ' + ge.toFixed(1) + '%,var(--warn) '
      + (100 - (100-ge)*0.5).toFixed(1) + '%,var(--bad) 100%)'
  };
}

/* ---------- расчёт ---------- */
function addMetric(name, v, lo, hi, m, u, segs) {
  var s = score(v, lo, hi, m);
  METRICS.push({ n: name, v: v, lo: lo, hi: hi, m: m, u: u, s: Math.round(s), segs: segs });
  return s;
}
function finish() {
  var W = img.width, H = img.height;
  PTS = {};
  POINTS.forEach(function (t, i) { PTS[t[0]] = { x: placed[i].x * W, y: placed[i].y * H }; });
  var bizy = dist(PTS.bizR, PTS.bizL);
  var eyew = (dist(PTS.eyeRo, PTS.eyeRi) + dist(PTS.eyeLo, PTS.eyeLi)) / 2;
  var fh = dist(PTS.hair, PTS.chin);
  METRICS = [];
  var S = [];
  function push(s) { S.push(s); }

  var up = dist(PTS.hair, PTS.nas), mid = dist(PTS.nas, PTS.sub), low = dist(PTS.sub, PTS.chin);
  thirds = [up, mid, low];
  var tt = up + mid + low;

  var ct = ((Math.atan2(PTS.eyeRi.y-PTS.eyeRo.y, Math.abs(PTS.eyeRo.x-PTS.eyeRi.x)) +
             Math.atan2(PTS.eyeLi.y-PTS.eyeLo.y, Math.abs(PTS.eyeLo.x-PTS.eyeLi.x))) / 2) * 180 / Math.PI;
  push(addMetric("Canthal tilt", ct, 5.2, 8.5, 9, "°", [["eyeRo","eyeRi"],["eyeLo","eyeLi"]]));
  push(addMetric("Eye aspect",
    (dist(PTS.eyeRo,PTS.eyeRi)/Math.max(1,dist(PTS.eyeRu,PTS.eyeRl)) +
     dist(PTS.eyeLo,PTS.eyeLi)/Math.max(1,dist(PTS.eyeLu,PTS.eyeLl))) / 2,
    2.8, 3.6, 1.3, "", [["eyeRo","eyeRi"],["eyeRu","eyeRl"],["eyeLo","eyeLi"],["eyeLu","eyeLl"]]));
  push(addMetric("Eye spacing", dist(PTS.eyeRi,PTS.eyeLi)/Math.max(1,eyew), .93, 1.04, .22, "", [["eyeRi","eyeLi"]]));
  push(addMetric("IPD/eye", dist(PTS.eyeRc,PTS.eyeLc)/Math.max(1,eyew), 1.9, 2.2, .6, "", [["eyeRc","eyeLc"]]));
  push(addMetric("Fifths", eyew/(bizy/5), .9, 1.1, .3, "", [["eyeRo","eyeRi"],["bizR","bizL"]]));
  push(addMetric("FWHR", bizy/Math.max(1,dist(PTS.nas,PTS.lt)), 1.9, 2.06, .5, "", [["bizR","bizL"],["nas","lt"]]));
  push(addMetric("Total FWHR", fh/bizy, 1.33, 1.38, .22, "", [["hair","chin"],["bizR","bizL"]]));
  push(addMetric("Midface", bizy/Math.max(1,dist(PTS.nas,PTS.sub)), 1.5, 1.7, .35, "", [["bizR","bizL"],["nas","sub"]]));
  push(addMetric("Mouth/Nose", dist(PTS.mouR,PTS.mouL)/Math.max(1,dist(PTS.noseR,PTS.noseL)), 1.38, 1.53, .45, "", [["mouR","mouL"],["noseR","noseL"]]));
  push(addMetric("Nose W/H", dist(PTS.noseR,PTS.noseL)/Math.max(1,dist(PTS.nas,PTS.ntip)), .62, .88, .3, "", [["noseR","noseL"],["nas","ntip"]]));
  push(addMetric("Lip ratio", dist(PTS.st,PTS.lb)/Math.max(1,dist(PTS.lt,PTS.st)), 1.4, 2, .9, "", [["st","lb"],["lt","st"]]));
  push(addMetric("Chin/Philtrum", dist(PTS.lb,PTS.chin)/Math.max(1,dist(PTS.sub,PTS.lt)), 2.05, 2.55, 1, "", [["lb","chin"],["sub","lt"]]));
  push(addMetric("Bigonial %", 100*dist(PTS.gonR,PTS.gonL)/bizy, 85.5, 92, 12, "%", [["gonR","gonL"],["bizR","bizL"]]));
  push(addMetric("Bitemporal %", 100*dist(PTS.tempR,PTS.tempL)/bizy, 84, 95, 12, "%", [["tempR","tempL"],["bizR","bizL"]]));
  push(addMetric("Lower face %", 100*low/fh, 30.6, 34, 7, "%", [["sub","chin"],["hair","chin"]]));
  push(addMetric("Neck width %", 100*dist(PTS.neckR,PTS.neckL)/bizy, 90, 100, 14, "%", [["neckR","neckL"],["bizR","bizL"]]));
  push(addMetric("Brow position",
    (Math.abs(PTS.eyeRu.y-PTS.browRp.y)+Math.abs(PTS.eyeLu.y-PTS.browLp.y))/2/
    Math.max(1,(dist(PTS.eyeRu,PTS.eyeRl)+dist(PTS.eyeLu,PTS.eyeLl))/2),
    0, .65, .8, "", [["eyeRu","browRp"],["eyeLu","browLp"]]));
  var bt = ((Math.atan2(PTS.browRp.y-PTS.browRi.y, Math.abs(PTS.browRo.x-PTS.browRi.x)) +
             Math.atan2(PTS.browLp.y-PTS.browLi.y, Math.abs(PTS.browLo.x-PTS.browLi.x))) / 2) * 180 / Math.PI;
  push(addMetric("Brow tilt", bt, 5, 13, 9, "°", [["browRi","browRo"],["browLi","browLo"]]));
  push(addMetric("Cheekbone pos", 100*((PTS.zygR.y+PTS.zygL.y)/2-PTS.hair.y)/fh, 81, 100, 22, "%", [["zygR","zygL"]]));
  push(addMetric("Cheek sculpt", 100*(bizy-dist(PTS.holR,PTS.holL))/bizy, 10, 18, 12, "%", [["bizR","bizL"],["holR","holL"]]));
  push(addMetric("Jaw frontal °", angleAt(PTS.gonR,PTS.chin,PTS.gonL), 84.5, 95, 14, "°", [["gonR","chin"],["gonL","chin"]]));
  push(addMetric("Jawline def",
    (angleAt(PTS.gonR,PTS.jawMidR,PTS.jawLowR)+angleAt(PTS.gonL,PTS.jawMidL,PTS.jawLowL))/2,
    160, 178, 22, "°", [["gonR","jawMidR"],["jawMidR","jawLowR"],["gonL","jawMidL"],["jawMidL","jawLowL"]]));
  var sym = 100 - (
    Math.abs(dist(PTS.eyeRo,PTS.eyeRi)-dist(PTS.eyeLo,PTS.eyeLi))/Math.max(1,eyew)*100 +
    Math.abs(dist(PTS.gonR,PTS.chin)-dist(PTS.gonL,PTS.chin))/Math.max(1,dist(PTS.gonR,PTS.chin))*100) / 2;
  push(addMetric("Symmetry", sym, 90, 97, 10, "%", [["hair","chin"]]));

  overall = pmean(S, PVAL);
  psl = Math.max(1, Math.min(8, overall / 10 - 2));
  soundDone();
  elEditor.style.display = 'none';
  elResult.style.display = 'flex';
  buildList();
  showMetric(0);
}

/* ---------- результат: список + шкалы ---------- */
function buildList() {
  var tt = thirds[0] + thirds[1] + thirds[2];
  var html = '<h1 style="padding:4px 0 0">' + overall.toFixed(1) + ' / 100</h1>'
    + '<div class="sub">⭐ PSL ' + psl.toFixed(1) + '/8 · Thirds '
    + Math.round(100*thirds[0]/tt) + '/' + Math.round(100*thirds[1]/tt) + '/' + Math.round(100*thirds[2]/tt)
    + '% · тапни метрику — линии на фото</div>';
  METRICS.forEach(function (m, i) {
    var gz = gauge(m.v, m.lo, m.hi, m.m);
    var c = colorOf(m.s);
    html += '<div class="mrow" data-i="' + i + '">'
      + '<div class="mhead"><span>' + m.n + '</span>'
      + '<span class="chip" style="background:' + c + '22;color:' + c + '">' + m.s + '</span></div>'
      + '<div class="gauge" style="background:' + gz.grad + '"><i style="left:' + gz.pos + '%"></i></div>'
      + '<div class="sub">' + m.v.toFixed(2) + m.u + ' · идеал ' + m.lo + '–' + m.hi + '</div></div>';
  });
  elList.innerHTML = html;
  var rows = elList.querySelectorAll('.mrow');
  rows.forEach(function (el) {
    el.addEventListener('click', function () { showMetric(+el.getAttribute('data-i')); haptic(); });
  });
}

/* ---------- презентация: линии на фото ---------- */
function showMetric(i) {
  var m = METRICS[i];
  var w = elRcv.clientWidth, h = elRcv.clientHeight;
  elRcv.width = w * dpr; elRcv.height = h * dpr;
  var s = Math.min(w / img.width, h / img.height);
  var ox = (w - img.width * s) / 2, oy = (h - img.height * s) / 2;
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.clearRect(0, 0, w, h);
  rctx.save(); rctx.translate(ox, oy); rctx.scale(s, s);
  rctx.drawImage(img, 0, 0); rctx.restore();
  var c = colorOf(m.s);
  rctx.strokeStyle = c; rctx.lineWidth = 2.5;
  rctx.shadowColor = c; rctx.shadowBlur = 6;
  (m.segs || []).forEach(function (seg) {
    var a = PTS[seg[0]], b = PTS[seg[1]];
    if (!a || !b) return;
    rctx.beginPath();
    rctx.moveTo(a.x*s+ox, a.y*s+oy); rctx.lineTo(b.x*s+ox, b.y*s+oy);
    rctx.stroke();
    rctx.fillStyle = c;
    rctx.beginPath(); rctx.arc(a.x*s+ox, a.y*s+oy, 3, 0, 7); rctx.fill();
    rctx.beginPath(); rctx.arc(b.x*s+ox, b.y*s+oy, 3, 0, 7); rctx.fill();
  });
  rctx.shadowBlur = 0;
  rctx.fillStyle = c; rctx.font = '700 14px sans';
  rctx.fillText(m.n + ' · ' + m.s + '/100', 10, 20);
}

/* ---------- отправка ---------- */
elSend.addEventListener('click', function () {
  var txt = "📊 LUX PRO: " + overall.toFixed(1) + "/100 | PSL " + psl.toFixed(1) + "/8\n"
    + METRICS.map(function (m) {
        return "• " + m.n + ": " + m.v.toFixed(2) + m.u + " | " + m.s + "/100";
      }).join("\n");
  if (TG) { TG.sendData(JSON.stringify({ t: "lux", text: txt })); TG.close(); }
});
</script>
