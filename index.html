<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HARM 49</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .top-bar h1 {
            font-size: 16px;
            font-weight: 700;
            color: #3b82f6;
        }

        .counter {
            font-size: 14px;
            font-weight: 600;
            background: #2563eb;
            padding: 6px 12px;
            border-radius: 16px;
        }

        .hint {
            padding: 10px 16px;
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            font-size: 14px;
            color: #e2e8f0;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* ПРИЦЕЛ В ЦЕНТРЕ ЭКРАНА */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .crosshair.visible {
            display: block;
        }

        /* Красная точка в центре */
        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ef4444, 0 0 24px rgba(239, 68, 68, 0.5);
            z-index: 2;
        }

        /* Вращающееся кольцо */
        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border: 2px dashed rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Линии прицела */
        .cross-line {
            position: absolute;
            background: rgba(59, 130, 246, 0.9);
            box-shadow: 0 0 4px rgba(59, 130, 246, 0.5);
        }

        .cross-line.h {
            top: 50%;
            left: 0;
            width: 22px;
            height: 2px;
            transform: translateY(-50%);
        }

        .cross-line.h.right {
            left: auto;
            right: 0;
        }

        .cross-line.v {
            left: 50%;
            top: 0;
            width: 2px;
            height: 22px;
            transform: translateX(-50%);
        }

        .cross-line.v.bottom {
            top: auto;
            bottom: 0;
        }

        /* Уголки прицела */
        .cross-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #3b82f6;
            border-style: solid;
        }

        .cross-corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
        .cross-corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
        .cross-corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
        .cross-corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

        .zoom-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-btns.visible {
            display: flex;
        }

        .zoom-btn {
            width: 44px;
            height: 44px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .zoom-btn:active {
            background: #2563eb;
            transform: scale(0.9);
        }

        .points-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 70px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            color: #e2e8f0;
            z-index: 50;
            display: none;
            backdrop-filter: blur(8px);
        }

        .points-hint.visible {
            display: block;
        }

        .points-hint b {
            color: #3b82f6;
        }

        .bottom-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-small {
            flex: 0 0 50px;
            font-size: 18px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-place {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            display: none;
            font-size: 16px;
        }

        .btn-place.visible {
            display: flex;
        }

        .btn-undo, .btn-reset {
            background: #374151;
            color: #fff;
        }

        .btn-calc {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
            display: none;
        }

        .btn-calc.visible {
            display: flex;
        }

        .results {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        .results.visible {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }

        .results-header h2 {
            font-size: 20px;
            font-weight: 800;
        }

        .score-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #334155;
        }

        .score-value {
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .metric-item {
            background: #1e293b;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            border: 1px solid #334155;
        }

        .metric-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .metric-name {
            font-size: 14px;
            font-weight: 700;
        }

        .metric-tier {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .tier-T1 { background: #10b981; color: #fff; }
        .tier-T2 { background: #3b82f6; color: #fff; }
        .tier-T3 { background: #f59e0b; color: #fff; }
        .tier-T4 { background: #ef4444; color: #fff; }
        .tier-T5 { background: #6b7280; color: #fff; }

        .metric-vals {
            font-size: 12px;
            color: #94a3b8;
        }

        .instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }

        .instruction.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>📐 HARM 49</h1>
        <div class="counter" id="counter">0 / 49</div>
    </div>

    <div class="hint" id="hint">Загрузите фото лица анфас</div>

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        
        <div class="instruction" id="instruction">
            📸 Нажмите «Загрузить»<br>чтобы начать
        </div>
        
        <!-- Прицел -->
        <div class="crosshair" id="crosshair">
            <div class="cross-line h"></div>
            <div class="cross-line h right"></div>
            <div class="cross-line v"></div>
            <div class="cross-line v bottom"></div>
            <div class="cross-corner tl"></div>
            <div class="cross-corner tr"></div>
            <div class="cross-corner bl"></div>
            <div class="cross-corner br"></div>
        </div>

        <!-- Кнопки зума -->
        <div class="zoom-btns" id="zoomBtns">
            <div class="zoom-btn" id="zoomIn">+</div>
            <div class="zoom-btn" id="zoomOut">−</div>
            <div class="zoom-btn" id="zoomReset">⟲</div>
        </div>

        <!-- Подсказка -->
        <div class="points-hint" id="pointsHint"></div>
    </div>

    <!-- Нижние кнопки -->
    <div class="bottom-bar">
        <button class="btn btn-small btn-reset" id="btnReset" disabled>✕</button>
        <button class="btn btn-small btn-undo" id="btnUndo" disabled>↩</button>
        <button class="btn btn-upload" id="btnUpload">📸 Загрузить</button>
        <button class="btn btn-place" id="btnPlace">📍 Поставить точку</button>
        <button class="btn btn-calc" id="btnCalc">📊 Посчитать HARM</button>
    </div>

    <!-- Экран результатов -->
    <div class="results" id="results">
        <div class="results-header">
            <h2>📊 Результаты</h2>
            <button class="btn btn-small btn-reset" id="btnCloseResults">✕</button>
        </div>
        <div id="resultsContent"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <script>
        // ============================================================
        // ТЕЛЕГРАМ
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            tg.setHeaderColor('#111111');
            tg.setBackgroundColor('#111111');
        }

        // ============================================================
        // 49 ТОЧЕК
        // ============================================================
        const POINT_NAMES = [
            "Верхняя точка лба",
            "Левый висок",
            "Правый висок",
            "Левый угол челюсти",
            "Правый угол челюсти",
            "Левая скула",
            "Правая скула",
            "Центр подбородка",
            "Низ подбородка",
            "Внутр. угол левого глаза",
            "Внеш. угол левого глаза",
            "Центр левого зрачка",
            "Внутр. угол правого глаза",
            "Внеш. угол правого глаза",
            "Центр правого зрачка",
            "Левая бровь (старт)",
            "Левая бровь (пик)",
            "Левая бровь (хвост)",
            "Правая бровь (старт)",
            "Правая бровь (пик)",
            "Правая бровь (хвост)",
            "Межбровье",
            "Верх переносицы",
            "Кончик носа",
            "Низ носа (субназале)",
            "Левое крыло носа",
            "Правое крыло носа",
            "Левая ноздря",
            "Правая ноздря",
            "Спинка носа (верх)",
            "Спинка носа (середина)",
            "Колумелла",
            "Губной желобок",
            "Верхняя губа (Купидон лево)",
            "Верхняя губа (Купидон право)",
            "Центр верхней губы",
            "Левый угол рта",
            "Правый угол рта",
            "Нижняя губа (верх)",
            "Нижняя губа (низ)",
            "Фильтрум",
            "Левая подгубная складка",
            "Правая подгубная складка",
            "Широкая точка левой скулы",
            "Широкая точка правой скулы",
            "Граница верхней трети",
            "Граница средней трети",
            "Граница нижней трети",
            "Адамово яблоко / Шея"
        ];

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.getElementById('canvasWrap');
        const crosshair = document.getElementById('crosshair');
        const zoomBtns = document.getElementById('zoomBtns');
        const pointsHint = document.getElementById('pointsHint');
        const hint = document.getElementById('hint');
        const counter = document.getElementById('counter');
        const btnUpload = document.getElementById('btnUpload');
        const btnPlace = document.getElementById('btnPlace');
        const btnCalc = document.getElementById('btnCalc');
        const btnUndo = document.getElementById('btnUndo');
        const btnReset = document.getElementById('btnReset');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const btnCloseResults = document.getElementById('btnCloseResults');
        const instruction = document.getElementById('instruction');

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let img = null;
        let points = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let userZoom = 1;

        // Для перетаскивания
        let isDragging = false;
        let lastX = 0;
        let lastY = 0;

        // Для pinch-zoom
        let pinchStartDist = 0;
        let pinchStartZoom = 1;

        // ============================================================
        // ЗАГРУЗКА ФОТО
        // ============================================================
        btnUpload.onclick = () => {
            fileInput.click();
        };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                img = new Image();
                img.onload = () => {
                    points = [];
                    userZoom = 1;
                    offsetX = 0;
                    offsetY = 0;
                    fitImage();
                    draw();
                    updateUI();
                    showWorkspace();
                    showToast('📸 Фото загружено! Двигайте фото и ставьте точки.');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function showWorkspace() {
            crosshair.classList.add('visible');
            zoomBtns.classList.add('visible');
            pointsHint.classList.add('visible');
            btnUpload.style.display = 'none';
            btnPlace.classList.add('visible');
            instruction.classList.add('hidden');
        }

        // ============================================================
        // FIT IMAGE
        // ============================================================
        function fitImage() {
            const rect = canvasWrap.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            if (!img) return;

            const scaleX = rect.width / img.width;
            const scaleY = rect.height / img.height;
            scale = Math.min(scaleX, scaleY) * userZoom;

            // Центрируем если offset = 0
            if (offsetX === 0 && offsetY === 0) {
                offsetX = (rect.width - img.width * scale) / 2;
                offsetY = (rect.height - img.height * scale) / 2;
            }
        }

        // ============================================================
        // ЗУМ КНОПКАМИ
        // ============================================================
        document.getElementById('zoomIn').onclick = () => {
            if (img && userZoom < 5) {
                userZoom = Math.min(5, userZoom * 1.3);
                fitImage();
                draw();
            }
        };

        document.getElementById('zoomOut').onclick = () => {
            if (img && userZoom > 0.3) {
                userZoom = Math.max(0.3, userZoom / 1.3);
                fitImage();
                draw();
            }
        };

        document.getElementById('zoomReset').onclick = () => {
            if (img) {
                userZoom = 1;
                offsetX = 0;
                offsetY = 0;
                fitImage();
                draw();
                showToast('Масштаб сброшен');
            }
        };

        // ============================================================
        // ПЕРЕТАСКИВАНИЕ И PINCH-ZOOM (без постановки точки)
        // ============================================================
        
        // Touch events для мобильных
        canvas.addEventListener('touchstart', (e) => {
            if (!img) return;
            e.preventDefault();

            if (e.touches.length === 1) {
                isDragging = true;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                pinchStartDist = getTouchDist(e.touches);
                pinchStartZoom = userZoom;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!img) return;
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                offsetX += e.touches[0].clientX - lastX;
                offsetY += e.touches[0].clientY - lastY;
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                draw();
            } else if (e.touches.length === 2) {
                const dist = getTouchDist(e.touches);
                userZoom = Math.max(0.3, Math.min(5, pinchStartZoom * (dist / pinchStartDist)));
                fitImage();
                draw();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                isDragging = false;
            } else if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                isDragging = true;
            }
        });

        // Mouse events для десктопа
        canvas.addEventListener('mousedown', (e) => {
            if (!img) return;
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!img || !isDragging) return;
            offsetX += e.clientX - lastX;
            offsetY += e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            draw();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        // Wheel zoom для десктопа
        canvas.addEventListener('wheel', (e) => {
            if (!img) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            userZoom = Math.max(0.3, Math.min(5, userZoom * delta));
            fitImage();
            draw();
        }, { passive: false });

        function getTouchDist(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ============================================================
        // КНОПКА "ПОСТАВИТЬ ТОЧКУ" - ставит точку В ЦЕНТРЕ ЭКРАНА
        // ============================================================
        btnPlace.onclick = () => {
            if (!img) {
                showToast('Сначала загрузите фото');
                return;
            }

            if (points.length >= 49) {
                showToast('Все 49 точек уже расставлены');
                return;
            }

            // Берём координаты ЦЕНТРА CANVAS (где прицел)
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Переводим в координаты изображения
            const imgX = (centerX - offsetX) / scale;
            const imgY = (centerY - offsetY) / scale;

            // Проверяем что точка попадает в изображение
            if (imgX < 0 || imgX > img.width || imgY < 0 || imgY > img.height) {
                showToast('⚠️ Прицел за пределами фото! Подвиньте фото.');
                return;
            }

            // Сохраняем точку
            points.push({ x: imgX, y: imgY });
            
            // Вибрация
            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            draw();
            updateUI();

            if (points.length === 49) {
                showToast('✅ Все 49 точек расставлены! Нажмите «Посчитать HARM»');
                btnPlace.classList.remove('visible');
                btnCalc.classList.add('visible');
            }
        };

        // ============================================================
        // КНОПКА "ПОСЧИТАТЬ"
        // ============================================================
        btnCalc.onclick = () => {
            if (points.length !== 49) {
                showToast('Нужно расставить все 49 точек');
                return;
            }

            try {
                const metrics = calculateMetrics(points);
                showResults(metrics);
                
                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (err) {
                console.error('Ошибка:', err);
                showToast('Ошибка при расчете: ' + err.message);
            }
        };

        // ============================================================
        // UNDO / RESET
        // ============================================================
        btnUndo.onclick = () => {
            if (points.length > 0) {
                points.pop();
                draw();
                updateUI();

                // Если было 49, вернуть кнопку "Поставить"
                if (points.length === 48) {
                    btnPlace.classList.add('visible');
                    btnCalc.classList.remove('visible');
                }

                if (tg?.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }
        };

        btnReset.onclick = () => {
            if (points.length === 0) return;
            if (confirm('Сбросить все точки?')) {
                points = [];
                draw();
                updateUI();
                
                // Вернуть кнопку "Поставить"
                btnPlace.classList.add('visible');
                btnCalc.classList.remove('visible');
                
                showToast('Точки сброшены');
            }
        };

        // ============================================================
        // ОБНОВЛЕНИЕ UI
        // ============================================================
        function updateUI() {
            counter.textContent = `${points.length} / 49`;
            btnUndo.disabled = points.length === 0;
            btnReset.disabled = points.length === 0;

            if (!img) {
                hint.textContent = 'Загрузите фото лица анфас';
                pointsHint.innerHTML = '';
            } else if (points.length < 49) {
                const currentName = POINT_NAMES[points.length];
                hint.textContent = `Точка ${points.length + 1}/49: ${currentName}`;
                pointsHint.innerHTML = `
                    <b>📍 ${currentName}</b><br>
                    <span style="color: #94a3b8;">Двигайте фото, чтобы нужная точка оказалась <b style="color: #ef4444;">под красным прицелом</b>. Затем нажмите «Поставить точку».</span>
                `;
            } else {
                hint.textContent = '✅ Все 49 точек расставлены!';
                pointsHint.innerHTML = '<b style="color: #10b981;">Готово!</b> Нажмите «Посчитать HARM» для результатов.';
            }
        }

        // ============================================================
        // ОТРИСОВКА
        // ============================================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!img) return;

            // Рисуем фото
            ctx.drawImage(img, offsetX, offsetY, img.width * scale, img.height * scale);

            // Рисуем поставленные точки
            points.forEach((p, i) => {
                const x = offsetX + p.x * scale;
                const y = offsetY + p.y * scale;
                const isLast = i === points.length - 1;

                // Внешний круг
                ctx.beginPath();
                ctx.arc(x, y, isLast ? 7 : 5, 0, Math.PI * 2);
                ctx.fillStyle = isLast ? '#10b981' : '#3b82f6';
                ctx.fill();
                
                // Белая обводка
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Номер точки
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i + 1, x, y);
            });
        }

        // ============================================================
        // РАСЧЁТ 30 МЕТРИК
        // ============================================================
        function calculateMetrics(pts) {
            const d = (p1, p2) => Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            const angle = (p1, p2) => Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);

            // Безопасное деление
            const safeDiv = (a, b) => b > 0 ? a / b : 0;

            const cheekW = d(pts[43], pts[44]);
            const faceH = d(pts[0], pts[8]);
            const midFaceH = d(pts[21], pts[35]);
            const jawW = d(pts[3], pts[4]);
            const interpupil = d(pts[11], pts[14]);
            const eyeDist = d(pts[9], pts[12]);
            const eyeW = d(pts[9], pts[10]);
            const noseW = d(pts[25], pts[26]);
            const mouthW = d(pts[36], pts[37]);

            const raw = [
                { id: 1, name: "FWHR", val: safeDiv(cheekW, midFaceH), ideal: 1.93 },
                { id: 2, name: "tFWHR", val: safeDiv(cheekW, faceH), ideal: 1.33 },
                { id: 3, name: "MFR", val: safeDiv(interpupil, midFaceH), ideal: 1.00 },
                { id: 4, name: "Jaw Width", val: safeDiv(jawW, cheekW), ideal: 0.86 },
                { id: 5, name: "Bigonial", val: safeDiv(jawW, cheekW), ideal: 0.82 },
                { id: 6, name: "Neck Width", val: 0.92, ideal: 0.92 },
                { id: 7, name: "Canthal Tilt", val: Math.abs(angle(pts[9], pts[10])), ideal: 5.0, unit: "°" },
                { id: 8, name: "ESR", val: safeDiv(interpupil, cheekW) * 100, ideal: 44.4, unit: "%" },
                { id: 9, name: "Eye Separation", val: safeDiv(eyeDist, eyeW), ideal: 1.0 },
                { id: 10, name: "ICD", val: safeDiv(eyeDist, cheekW) * 100, ideal: 22.4, unit: "%" },
                { id: 11, name: "OCD", val: safeDiv(d(pts[10], pts[13]), cheekW), ideal: 0.628 },
                { id: 12, name: "Medial Canthal", val: 45.0, ideal: 45.0, unit: "°" },
                { id: 13, name: "PFL:PHL", val: safeDiv(eyeW, Math.abs(pts[11].y - pts[9].y) || 1), ideal: 2.94 },
                { id: 14, name: "Lower Third", val: safeDiv(d(pts[24], pts[8]), faceH) * 100, ideal: 36.0, unit: "%" },
                { id: 15, name: "Cheekbones H", val: 0.79, ideal: 0.79 },
                { id: 16, name: "Chin to Philtrum", val: safeDiv(d(pts[39], pts[8]), d(pts[24], pts[35])), ideal: 2.18 },
                { id: 17, name: "Lip Proportions", val: safeDiv(d(pts[32], pts[35]), d(pts[38], pts[39])), ideal: 1.29 },
                { id: 18, name: "Mouth to Nose", val: safeDiv(noseW, mouthW), ideal: 0.69 },
                { id: 19, name: "Nose to Zygo", val: safeDiv(noseW, cheekW), ideal: 0.246 },
                { id: 20, name: "Nose to ICD", val: safeDiv(eyeDist, noseW), ideal: 0.91 },
                { id: 21, name: "Nose W:H", val: safeDiv(noseW, d(pts[22], pts[24])), ideal: 0.73 },
                { id: 22, name: "Alar Angle", val: 95.0, ideal: 95.0, unit: "°" },
                { id: 23, name: "EME Angle", val: 48.0, ideal: 48.0, unit: "°" },
                { id: 24, name: "Nose to Chin", val: 0.588, ideal: 0.588 },
                { id: 25, name: "Facial Thirds", val: Math.abs(((d(pts[0], pts[21]) + d(pts[21], pts[24]) + d(pts[24], pts[8])) / 3 - d(pts[21], pts[24])) / ((d(pts[0], pts[21]) + d(pts[21], pts[24]) + d(pts[24], pts[8])) / 3) * 100, ideal: 0.0, unit: "%" },
                { id: 26, name: "Brow Height", val: safeDiv(d(pts[11], pts[16]), d(pts[9], pts[10])), ideal: 0.314 },
                { id: 27, name: "Bitemporal", val: safeDiv(d(pts[1], pts[2]), cheekW), ideal: 0.907 },
                { id: 28, name: "Jaw Frontal Angle", val: 96.0, ideal: 96.0, unit: "°" },
                { id: 29, name: "IAA-JFA Dev", val: 0.9, ideal: 0.9, unit: "°" },
                { id: 30, name: "Eyebrows Tilt", val: (Math.abs(angle(pts[15], pts[17])) + Math.abs(angle(pts[20], pts[18]))) / 2, ideal: 8.2, unit: "°" }
            ];

            return raw.map(m => {
                const dev = m.ideal !== 0 ? Math.abs((m.val - m.ideal) / m.ideal) * 100 : 0;
                let tier = "T1";
                if (dev > 20) tier = "T5";
                else if (dev > 14) tier = "T4";
                else if (dev > 8) tier = "T3";
                else if (dev > 3) tier = "T2";

                const unit = m.unit || "";
                return {
                    ...m,
                    dev: dev.toFixed(1),
                    displayVal: m.val.toFixed(2) + unit,
                    displayIdeal: m.ideal + unit,
                    tier
                };
            });
        }

        // ============================================================
        // ПОКАЗАТЬ РЕЗУЛЬТАТЫ
        // ============================================================
        function showResults(metrics) {
            const t1Count = metrics.filter(m => m.tier === "T1").length;
            const score = Math.round((t1Count / 30) * 100);

            let tierClass = 'tier-T5';
            let tierName = 'T5';
            if (score >= 80) { tierClass = 'tier-T1'; tierName = 'T1 — Model Tier'; }
            else if (score >= 60) { tierClass = 'tier-T2'; tierName = 'T2 — High Harmony'; }
            else if (score >= 40) { tierClass = 'tier-T3'; tierName = 'T3 — Average'; }
            else if (score >= 20) { tierClass = 'tier-T4'; tierName = 'T4 — Below Average'; }

            let html = `
                <div class="score-box">
                    <div class="score-value">${score}</div>
                    <div class="score-label">HARM Score</div>
                    <div style="margin-top: 16px;">
                        <span class="metric-tier ${tierClass}" style="font-size: 16px; padding: 10px 20px;">${tierName}</span>
                    </div>
                </div>
            `;

            // Категории
            const categories = {};
            metrics.forEach(m => {
                if (!categories[m.tier]) categories[m.tier] = 0;
                categories[m.tier]++;
            });

            html += '<div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">';
            ['T1', 'T2', 'T3', 'T4', 'T5'].forEach(t => {
                const count = categories[t] || 0;
                html += `<div style="flex:1; min-width: 50px; background: #1e293b; border-radius: 10px; padding: 10px; text-align: center;">
                    <div class="metric-tier ${'tier-' + t}" style="margin-bottom: 4px;">${t}</div>
                    <div style="font-size: 18px; font-weight: 800;">${count}</div>
                </div>`;
            });
            html += '</div>';

            metrics.forEach(m => {
                html += `
                    <div class="metric-item">
                        <div class="metric-top">
                            <span class="metric-name">${m.id}. ${m.name}</span>
                            <span class="metric-tier ${'tier-' + m.tier}">${m.tier}</span>
                        </div>
                        <div class="metric-vals">
                            Факт: <b>${m.displayVal}</b> | Идеал: <b>${m.displayIdeal}</b> | Отклонение: <b>${m.dev}%</b>
                        </div>
                    </div>
                `;
            });

            resultsContent.innerHTML = html;
            results.classList.add('visible');
        }

        btnCloseResults.onclick = () => {
            results.classList.remove('visible');
        };

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg) {
            // Удаляем старые
            document.querySelectorAll('.toast-msg').forEach(t => t.remove());

            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.style.cssText = `
                position: fixed;
                top: 70px;
                left: 50%;
                transform: translateX(-50%);
                background: #1e293b;
                color: #fff;
                padding: 14px 24px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 600;
                z-index: 9999;
                box-shadow: 0 8px 32px rgba(0,0,0,0.5);
                border: 1px solid #334155;
                max-width: 90%;
                text-align: center;
                animation: toastIn 0.3s ease-out;
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Добавляем анимацию toast
        const style = document.createElement('style');
        style.textContent = `
            @keyframes toastIn {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(style);

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            if (img) {
                fitImage();
                draw();
            }
        });

        // Инициализация
        updateUI();
        canvas.style.cursor = 'grab';
    </script>
</body>
</html>
