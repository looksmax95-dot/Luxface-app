<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Looksmax Harmony Calculator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: -apple-system, sans-serif; background: #0b0b0e; color: #fff; text-align: center; height: 100vh; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; padding: 10px; }
        .header { font-size: 16px; font-weight: bold; color: #0088cc; margin-bottom: 4px; }
        .step-info { font-size: 13px; color: #8a8a93; margin-bottom: 8px; min-height: 32px; }
        #canvas-container { flex: 1; position: relative; background: #16161a; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { touch-action: none; max-width: 100%; max-height: 100%; }
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; background: #0088cc; color: white; cursor: pointer; }
        button:disabled { background: #222; color: #555; }
        .btn-sec { background: #222; max-width: 70px; }
        #result-modal { display: none; position: fixed; inset: 0; background: #0b0b0e; z-index: 10; overflow-y: auto; padding: 20px; text-align: left; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .green { background: #1b432c; color: #4ecc83; }
        .yellow { background: #4a3e10; color: #f7d050; }
        .red { background: #4a1919; color: #f75050; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">Looksmax HARM Analysis (49 Points)</div>
        <div class="step-info" id="step-title">Загрузите четкое фото лица анфас</div>
        
        <div id="canvas-container">
            <canvas id="main-canvas"></canvas>
        </div>

        <input type="file" id="file-input" accept="image/*" style="display:none">
        
        <div class="controls">
            <button class="btn-sec" id="btn-undo" disabled>↩️</button>
            <button id="btn-action">📸 Загрузить фото</button>
        </div>
    </div>

    <!-- Модальное окно результатов -->
    <div id="result-modal">
        <h2 style="text-align:center; margin-bottom:15px;">Результат HARM</h2>
        <div id="score-overview" style="text-align:center; margin-bottom:20px;"></div>
        <div id="metrics-list"></div>
        <button onclick="location.reload()" style="width:100%; margin-top:20px;">Новый расчет</button>
    </div>

    <script src="harm_math.js"></script>
    <script src="canvas_app.js"></script>
</body>
</html>
