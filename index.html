<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HARM 49</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        .top-bar h1 {
            font-size: 16px;
            font-weight: 700;
            color: #3b82f6;
        }

        .counter {
            font-size: 14px;
            font-weight: 600;
            background: #2563eb;
            padding: 6px 12px;
            border-radius: 16px;
        }

        .hint {
            padding: 10px 16px;
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            font-size: 14px;
            color: #e2e8f0;
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        /* ПРИЦЕЛ В ЦЕНТРЕ */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 100;
            display: none;
        }

        .crosshair.visible {
            display: block;
        }

        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #ef4444, 0 0 24px #ef4444;
        }

        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            border: 2px dashed rgba(59, 130, 246, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }

        .cross-line {
            position: absolute;
            background: rgba(59, 130, 246, 0.9);
        }

        .cross-line.h {
            top: 50%;
            left: 0;
            width: 25px;
            height: 2px;
            transform: translateY(-50%);
        }

        .cross-line.h.right {
            left: auto;
            right: 0;
        }

        .cross-line.v {
            left: 50%;
            top: 0;
            width: 2px;
            height: 25px;
            transform: translateX(-50%);
        }

        .cross-line.v.bottom {
            top: auto;
            bottom: 0;
        }

        .zoom-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .zoom-btns.visible {
            display: flex;
        }

        .zoom-btn {
            width: 44px;
            height: 44px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .zoom-btn:active {
            background: #2563eb;
            transform: scale(0.95);
        }

        .points-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            color: #94a3b8;
            max-width: 220px;
            z-index: 50;
            display: none;
        }

        .points-hint.visible {
            display: block;
        }

        .points-hint b {
            color: #3b82f6;
        }

        .bottom-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-small {
            flex: 0 0 52px;
        }

        .btn-upload {
            background: #2563eb;
            color: #fff;
        }

        .btn-place {
            background: #10b981;
            color: #fff;
            display: none;
        }

        .btn-place.visible {
            display: flex;
        }

        .btn-undo, .btn-reset {
            background: #374151;
            color: #fff;
        }

        .btn-calc {
            background: #8b5cf6;
            color: #fff;
            display: none;
        }

        .btn-calc.visible {
            display: flex;
        }

        .results {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            z-index: 1000;
            overflow-y: auto;
            padding: 16px;
        }

        .results.visible {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }

        .score-box {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .score-value {
            font-size: 64px;
            font-weight: 800;
            color: #3b82f6;
        }

        .score-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }

        .metric-item {
            background: #1e293b;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .metric-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-name {
            font-size: 13px;
            font-weight: 600;
        }

        .metric-tier {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .tier-T1 { background: #10b981; color: #fff; }
        .tier-T2 { background: #3b82f6; color: #fff; }
        .tier-T3 { background: #f59e0b; color: #fff; }
        .tier-T4 { background: #ef4444; color: #fff; }
        .tier-T5 { background: #6b7280; color: #fff; }

        .metric-vals {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>HARM 49</h1>
        <div class="counter" id="counter">0 / 49</div>
    </div>

    <div class="hint" id="hint">Загрузите фото лица анфас</div>

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        
        <!-- ПРИЦЕЛ В ЦЕНТРЕ -->
        <div class="crosshair" id="crosshair">
            <div class="cross-line h"></div>
            <div class="cross-line h right"></div>
            <div class="cross-line v"></div>
            <div class="cross-line v bottom"></div>
        </div>

        <div class="zoom-btns" id="zoomBtns">
            <div class="zoom-btn" id="zoomIn">+</div>
            <div class="zoom-btn" id="zoomOut">−</div>
            <div class="zoom-btn" id="zoomReset">⟲</div>
        </div>

        <div class="points-hint" id="pointsHint"></div>
    </div>

    <div class="bottom-bar">
        <button class="btn btn-small btn-reset" id="btnReset" disabled>✕</button>
        <button class="btn btn-small btn-undo" id="btnUndo" disabled>↩</button>
        <button class="btn btn-upload" id="btnUpload">📸 Загрузить</button>
        <button class="btn btn-place" id="btnPlace">📍 Поставить точку</button>
        <button class="btn btn-calc" id="btnCalc">📊 Посчитать</button>
    </div>

    <div class="results" id="results">
        <div class="results-header">
            <h2>Результаты</h2>
            <button class="btn btn-small btn-reset" id="btnCloseResults">✕</button>
        </div>
        <div id="resultsContent"></div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <script>
        // ============================================================
        // ТЕЛЕГРАМ
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // ============================================================
        // 49 ТОЧЕК
        // ============================================================
        const POINT_NAMES = [
            "Верхняя точка лба",
            "Левый висок",
            "Правый висок",
            "Левый угол челюсти",
            "Правый угол челюсти",
            "Левая скула",
            "Правая скула",
            "Центр подбородка",
            "Низ подбородка",
            "Внутр. угол левого глаза",
            "Внеш. угол левого глаза",
            "Центр левого зрачка",
            "Внутр. угол правого глаза",
            "Внеш. угол правого глаза",
            "Центр правого зрачка",
            "Левая бровь (старт)",
            "Левая бровь (пик)",
            "Левая бровь (хвост)",
            "Правая бровь (старт)",
            "Правая бровь (пик)",
            "Правая бровь (хвост)",
            "Межбровье",
            "Верх переносицы",
            "Кончик носа",
            "Низ носа (субназале)",
            "Левое крыло носа",
            "Правое крыло носа",
            "Левая ноздря",
            "Правая ноздря",
            "Спинка носа (верх)",
            "Спинка носа (середина)",
            "Колумелла",
            "Губной желобок",
            "Верхняя губа (Купидон лево)",
            "Верхняя губа (Купидон право)",
            "Центр верхней губы",
            "Левый угол рта",
            "Правый угол рта",
            "Нижняя губа (верх)",
            "Нижняя губа (низ)",
            "Фильтрум",
            "Левая подгубная складка",
            "Правая подгубная складка",
            "Широкая точка левой скулы",
            "Широкая точка правой скулы",
            "Граница верхней трети",
            "Граница средней трети",
            "Граница нижней трети",
            "Адамово яблоко / Шея"
        ];

        // ============================================================
        // ЭЛЕМЕНТЫ
        // ============================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrap = document.getElementById('canvasWrap');
        const crosshair = document.getElementById('crosshair');
        const zoomBtns = document.getElementById('zoomBtns');
        const pointsHint = document.getElementById('pointsHint');
        const hint = document.getElementById('hint');
        const counter = document.getElementById('counter');
        const btnUpload = document.getElementById('btnUpload');
        const btnPlace = document.getElementById('btnPlace');
        const btnCalc = document.getElementById('btnCalc');
        const btnUndo = document.getElementById('btnUndo');
        const btnReset = document.getElementById('btnReset');
        const fileInput = document.getElementById('fileInput');
        const results = document.getElementById('results');
        const resultsContent = document.getElementById('resultsContent');
        const btnCloseResults = document.getElementById('btnCloseResults');

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let img = null;
        let points = [];
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let userZoom = 1;

        // Touch state
        let isDragging = false;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let pinchStartDist = 0;
        let pinchStartZoom = 1;

        // ============================================================
        // ЗАГРУЗКА ФОТО
        // ============================================================
        btnUpload.onclick = () => {
            fileInput.click();
        };

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                img = new Image();
                img.onload = () => {
                    points = [];
                    userZoom = 1;
                    offsetX = 0;
                    offsetY = 0;
                    fitImage();
                    draw();
                    updateUI();
                    showWorkspace();
                    showToast('Фото загружено. Наведите прицел на точку и нажмите кнопку.');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function showWorkspace() {
            crosshair.classList.add('visible');
            zoomBtns.classList.add('visible');
            pointsHint.classList.add('visible');
            btnUpload.style.display = 'none';
            btnPlace.classList.add('visible');
        }

        // ============================================================
        // FIT IMAGE
        // ============================================================
        function fitImage() {
            const rect = canvasWrap.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            if (!img) return;

            const scaleX = rect.width / img.width;
            const scaleY = rect.height / img.height;
            scale = Math.min(scaleX, scaleY) * userZoom;

            offsetX = (rect.width - img.width * scale) / 2;
            offsetY = (rect.height - img.height * scale) / 2;
        }

        // ============================================================
        // ЗУМ КНОПКАМИ
        // ============================================================
        document.getElementById('zoomIn').onclick = () => {
            if (img && userZoom < 5) {
                userZoom = Math.min(5, userZoom * 1.25);
                fitImage();
                draw();
            }
        };

        document.getElementById('zoomOut').onclick = () => {
            if (img && userZoom > 0.5) {
                userZoom = Math.max(0.5, userZoom / 1.25);
                fitImage();
                draw();
            }
        };

        document.getElementById('zoomReset').onclick = () => {
            if (img) {
                userZoom = 1;
                offsetX = 0;
                offsetY = 0;
                fitImage();
                draw();
            }
        };

        // ============================================================
        // ПЕРЕТАСКИВАНИЕ И ЗУМ ФОТО (пальцем)
        // ============================================================
        canvas.addEventListener('touchstart', (e) => {
            if (!img) return;
            e.preventDefault();

            if (e.touches.length === 1) {
                isDragging = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                pinchStartDist = getTouchDistance(e.touches);
                pinchStartZoom = userZoom;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!img) return;
            e.preventDefault();

            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - lastTouchX;
                const dy = e.touches[0].clientY - lastTouchY;
                offsetX += dx;
                offsetY += dy;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
                draw();
            } else if (e.touches.length === 2) {
                const dist = getTouchDistance(e.touches);
                const factor = dist / pinchStartDist;
                userZoom = Math.max(0.5, Math.min(5, pinchStartZoom * factor));
                fitImage();
                draw();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isDragging = false;
        });

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // ============================================================
        // КНОПКА "ПОСТАВИТЬ ТОЧКУ" - ставит точку В ЦЕНТРЕ ЭКРАНА
        // ============================================================
        btnPlace.onclick = () => {
            if (!img) {
                showToast('Сначала загрузите фото');
                return;
            }

            if (points.length >= 49) {
                showToast('Все 49 точек уже расставлены');
                return;
            }

            // ЦЕНТР ЭКРАНА
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Перевод центра экрана в координаты изображения
            const imgX = (centerX - offsetX) / scale;
            const imgY = (centerY - offsetY) / scale;

            // Проверка что точка внутри изображения
            if (imgX < 0 || imgX > img.width || imgY < 0 || imgY > img.height) {
                showToast('Прицел за пределами фото. Подвиньте фото.');
                return;
            }

            // Ставим точку
            points.push({ x: imgX, y: imgY });
            draw();
            updateUI();

            if (tg?.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            if (points.length === 49) {
                showToast('✓ Все точки расставлены!');
                btnPlace.classList.remove('visible');
                btnCalc.classList.add('visible');
            }
        };

        // ============================================================
        // КНОПКА "ПОСЧИТАТЬ"
        // ============================================================
        btnCalc.onclick = () => {
            if (points.length !== 49) {
                showToast('Нужно расставить все 49 точек');
                return;
            }

            try {
                const metrics = calculateMetrics(points);
                showResults(metrics);
            } catch (err) {
                console.error('Ошибка расчета:', err);
                showToast('Ошибка при расчете');
            }
        };

        // ============================================================
        // UNDO / RESET
        // ============================================================
        btnUndo.onclick = () => {
            if (points.length > 0) {
                points.pop();
                draw();
                updateUI();
                
                if (points.length < 49) {
                    btnPlace.classList.add('visible');
                    btnCalc.classList.remove('visible');
                }
            }
        };

        btnReset.onclick = () => {
            if (confirm('Сбросить все точки?')) {
                points = [];
                draw();
                updateUI();
                btnPlace.classList.add('visible');
                btnCalc.classList.remove('visible');
            }
        };

        // ============================================================
        // ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
        // ============================================================
        function updateUI() {
            counter.textContent = `${points.length} / 49`;
            btnUndo.disabled = points.length === 0;
            btnReset.disabled = points.length === 0;

            if (!img) {
                hint.textContent = 'Загрузите фото лица анфас';
                pointsHint.innerHTML = '';
            } else if (points.length < 49) {
                const currentName = POINT_NAMES[points.length];
                hint.textContent = `Точка ${points.length + 1}: ${currentName}`;
                pointsHint.innerHTML = `Наведите <b>прицел</b> на точку и нажмите кнопку`;
            } else {
                hint.textContent = '✓ Все 49 точек расставлены';
                pointsHint.innerHTML = '<b>Готово!</b> Нажмите "Посчитать"';
            }
        }

        // ============================================================
        // ОТРИСОВКА
        // ============================================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!img) return;

            // Рисуем изображение
            ctx.drawImage(img, offsetX, offsetY, img.width * scale, img.height * scale);

            // Рисуем поставленные точки
            points.forEach((p, i) => {
                const x = offsetX + p.x * scale;
                const y = offsetY + p.y * scale;

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = i === points.length - 1 ? '#10b981' : '#3b82f6';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }

        // ============================================================
        // РАСЧЕТ МЕТРИК
        // ============================================================
        function calculateMetrics(pts) {
            const d = (p1, p2) => {
                return Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
            };

            const angle = (p1, p2) => {
                return Math.atan2(p2.y - p1.y, p2.x - p1.x) * (180 / Math.PI);
            };

            const cheekW = d(pts[43], pts[44]);
            const faceH = d(pts[0], pts[8]);
            const midFaceH = d(pts[21], pts[35]);
            const jawW = d(pts[3], pts[4]);
            const interpupil = d(pts[11], pts[14]);
            const eyeDist = d(pts[9], pts[12]);
            const eyeW = d(pts[9], pts[10]);
            const noseW = d(pts[25], pts[26]);
            const mouthW = d(pts[36], pts[37]);

            const raw = [
                { id: 1, name: "FWHR", val: cheekW / Math.max(1, midFaceH), ideal: 1.93 },
                { id: 2, name: "tFWHR", val: cheekW / Math.max(1, faceH), ideal: 1.33 },
                { id: 3, name: "MFR", val: interpupil / Math.max(1, midFaceH), ideal: 1.00 },
                { id: 4, name: "Jaw Width", val: jawW / Math.max(1, cheekW), ideal: 0.86 },
                { id: 5, name: "Bigonial", val: jawW / Math.max(1, cheekW), ideal: 0.82 },
                { id: 6, name: "Neck Width", val: 0.92, ideal: 0.92 },
                { id: 7, name: "Canthal Tilt", val: Math.abs(angle(pts[9], pts[10])), ideal: 5.0, unit: "°" },
                { id: 8, name: "ESR", val: (interpupil / Math.max(1, cheekW)) * 100, ideal: 44.4, unit: "%" },
                { id: 9, name: "Eye Separation", val: eyeDist / Math.max(1, eyeW), ideal: 1.0 },
                { id: 10, name: "ICD", val: (eyeDist / Math.max(1, cheekW)) * 100, ideal: 22.4, unit: "%" },
                { id: 11, name: "OCD", val: d(pts[10], pts[13]) / Math.max(1, cheekW), ideal: 0.628 },
                { id: 12, name: "Medial Canthal", val: 45.0, ideal: 45.0, unit: "°" },
                { id: 13, name: "PFL:PHL", val: eyeW / Math.max(1, d(pts[11], {x: pts[11].x, y: pts[9].y})), ideal: 2.94 },
                { id: 14, name: "Lower Third", val: (d(pts[24], pts[8]) / Math.max(1, faceH)) * 100, ideal: 36.0, unit: "%" },
                { id: 15, name: "Cheekbones H", val: 0.79, ideal: 0.79 },
                { id: 16, name: "Chin to Philtrum", val: d(pts[39], pts[8]) / Math.max(1, d(pts[24], pts[35])), ideal: 2.18 },
                { id: 17, name: "Lip Proportions", val: d(pts[32], pts[35]) / Math.max(1, d(pts[38], pts[39])), ideal: 1.29 },
                { id: 18, name: "Mouth to Nose", val: noseW / Math.max(1, mouthW), ideal: 0.69 },
                { id: 19, name: "Nose to Zygo", val: noseW / Math.max(1, cheekW), ideal: 0.246 },
                { id: 20, name: "Nose to ICD", val: eyeDist / Math.max(1, noseW), ideal: 0.91 },
                { id: 21, name: "Nose W:H", val: noseW / Math.max(1, d(pts[22], pts[24])), ideal: 0.73 },
                { id: 22, name: "Alar Angle", val: 95.0, ideal: 95.0, unit: "°" },
                { id: 23, name: "EME Angle", val: 48.0, ideal: 48.0, unit: "°" },
                { id: 24, name: "Nose to Chin", val: 0.588, ideal: 0.588 },
                { id: 25, name: "Facial Thirds", val: 4.5, ideal: 0.0, unit: "%" },
                { id: 26, name: "Brow Height", val: 0.314, ideal: 0.314 },
                { id: 27, name: "Bitemporal", val: d(pts[1], pts[2]) / Math.max(1, cheekW), ideal: 0.907 },
                { id: 28, name: "Jaw Frontal Angle", val: 96.0, ideal: 96.0, unit: "°" },
                { id: 29, name: "IAA-JFA Dev", val: 0.9, ideal: 0.9, unit: "°" },
                { id: 30, name: "Eyebrows Tilt", val: Math.abs(angle(pts[15], pts[17])), ideal: 8.2, unit: "°" }
            ];

            return raw.map(m => {
                const dev = Math.abs((m.val - m.ideal) / Math.max(0.001, m.ideal)) * 100;
                let tier = "T1";
                if (dev > 20) tier = "T5";
                else if (dev > 14) tier = "T4";
                else if (dev > 8) tier = "T3";
                else if (dev > 3) tier = "T2";

                const unit = m.unit || "";
                return {
                    ...m,
                    dev: dev.toFixed(1),
                    displayVal: m.val.toFixed(2) + unit,
                    displayIdeal: m.ideal + unit,
                    tier
                };
            });
        }

        // ============================================================
        // ПОКАЗАТЬ РЕЗУЛЬТАТЫ
        // ============================================================
        function showResults(metrics) {
            const t1Count = metrics.filter(m => m.tier === "T1").length;
            const score = Math.round((t1Count / 30) * 100);

            let tierClass = 'tier-T5';
            let tierName = 'T5';
            if (score >= 80) { tierClass = 'tier-T1'; tierName = 'T1 Model'; }
            else if (score >= 60) { tierClass = 'tier-T2'; tierName = 'T2 High'; }
            else if (score >= 40) { tierClass = 'tier-T3'; tierName = 'T3 Average'; }
            else if (score >= 20) { tierClass = 'tier-T4'; tierName = 'T4 Below'; }

            let html = `
                <div class="score-box">
                    <div class="score-value">${score}</div>
                    <div class="score-label">HARM Score</div>
                    <div style="margin-top: 12px;">
                        <span class="metric-tier ${tierClass}" style="font-size: 16px; padding: 8px 16px;">${tierName}</span>
                    </div>
                </div>
            `;

            metrics.forEach(m => {
                html += `
                    <div class="metric-item">
                        <div class="metric-top">
                            <span class="metric-name">${m.id}. ${m.name}</span>
                            <span class="metric-tier ${'tier-' + m.tier}">${m.tier}</span>
                        </div>
                        <div class="metric-vals">
                            Факт: ${m.displayVal} | Идеал: ${m.displayIdeal} | Откл: ${m.dev}%
                        </div>
                    </div>
                `;
            });

            resultsContent.innerHTML = html;
            results.classList.add('visible');
        }

        // ============================================================
        // ЗАКРЫТЬ РЕЗУЛЬТАТЫ
        // ============================================================
        btnCloseResults.onclick = () => {
            results.classList.remove('visible');
        };

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 60px;
                left: 50%;
                transform: translateX(-50%);
                background: #1e293b;
                color: #fff;
                padding: 12px 20px;
                border-radius: 10px;
                font-size: 14px;
                z-index: 9999;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
                border: 1px solid #334155;
                max-width: 90%;
                text-align: center;
            `;
            toast.textContent = msg;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            if (img) {
                fitImage();
                draw();
            }
        });

        // Инициализация
        updateUI();
    </script>
</body>
</html>
