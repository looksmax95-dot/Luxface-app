                const devClass = devNum <= 3 ? 'good' : (devNum <= 8 ? 'warn' : 'bad');

                html += `
                    <div class="metric-card tier-T${m.tier.charAt(1)}" onclick="inspectMetric(${idx})">
                        <div class="m-head">
                            <span class="m-title">${m.name}</span>
                            <span class="m-tier-badge ${tierCls}">${m.tier}</span>
                        </div>
                        <div class="m-vals">
                            <span>Факт: <b>${m.displayVal}</b></span>
                            <span>Идеал: <b>${m.displayIdeal}</b></span>
                        </div>
                        <div class="scale-wrapper">
                            <div class="scale-bar"></div>
                            <div class="scale-pointer" style="left:${pointerPos}%"></div>
                        </div>
                        <div style="text-align: center; margin-top: 6px;">
                            <span class="m-deviation ${devClass}">Отклонение: ${m.dev}%</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('metrics-container').innerHTML = html;
        }

        // ================================================================
        // ===================== INSPECT METRIC ============================
        // ================================================================
        const inspCvs = document.getElementById('insp-cvs');
        const inspCtx = inspCvs.getContext('2d');

        function inspectMetric(idx) {
            const m = calculatedMetrics[idx];

            document.getElementById('insp-title').innerText = m.name;
            document.getElementById('insp-desc').innerText = 
                `Измеряет ${m.name.replace(/^\d+\.\s*/, '')}. Отклонение от идеала: ${m.dev}%`;

            // Update metrics display
            const metricsHtml = `
                <div class="insp-metric-item">
                    <div class="insp-metric-label">Фактическое</div>
                    <div class="insp-metric-value">${m.displayVal}</div>
                </div>
                <div class="insp-metric-item">
                    <div class="insp-metric-label">Идеальное</div>
                    <div class="insp-metric-value">${m.displayIdeal}</div>
                </div>
            `;
            document.getElementById('insp-metrics').innerHTML = metricsHtml;

            let pointerPos = 50 + ((m.val - m.ideal) / m.ideal) * 50;
            pointerPos = Math.max(5, Math.min(95, pointerPos));
            document.getElementById('insp-pointer').style.left = `${pointerPos}%`;

            document.getElementById('inspector-modal').style.display = 'flex';

            // Draw on inspector canvas after modal is visible
            setTimeout(() => {
                const vp = document.getElementById('insp-viewport');
                const dpr = window.devicePixelRatio || 1;
                
                inspCvs.width = vp.clientWidth * dpr;
                inspCvs.height = vp.clientHeight * dpr;
                inspCvs.style.width = vp.clientWidth + 'px';
                inspCvs.style.height = vp.clientHeight + 'px';
                inspCtx.scale(dpr, dpr);

                const displayWidth = vp.clientWidth;
                const displayHeight = vp.clientHeight;

                const sX = displayWidth / img.width;
                const sY = displayHeight / img.height;
                const iScale = Math.min(sX, sY);
                const iOffX = (displayWidth - img.width * iScale) / 2;
                const iOffY = (displayHeight - img.height * iScale) / 2;

                inspCtx.clearRect(0, 0, displayWidth, displayHeight);
                inspCtx.drawImage(img, iOffX, iOffY, img.width * iScale, img.height * iScale);

                // Draw lines between relevant points
                if (m.pts && m.pts.length > 1) {
                    // Determine color based on tier
                    let lineColor = '#3b82f6';
                    let glowColor = 'rgba(59, 130, 246, 0.6)';
                    
                    if (m.tier === 'T1') {
                        lineColor = '#10b981';
                        glowColor = 'rgba(16, 185, 129, 0.6)';
                    } else if (m.tier === 'T4' || m.tier === 'T5') {
                        lineColor = '#ef4444';
                        glowColor = 'rgba(239, 68, 68, 0.6)';
                    } else if (m.tier === 'T3') {
                        lineColor = '#f59e0b';
                        glowColor = 'rgba(245, 158, 11, 0.6)';
                    }

                    // Draw glow
                    inspCtx.shadowBlur = 15;
                    inspCtx.shadowColor = glowColor;
                    inspCtx.strokeStyle = lineColor;
                    inspCtx.lineWidth = 3;
                    inspCtx.lineCap = 'round';
                    inspCtx.lineJoin = 'round';

                    inspCtx.beginPath();
                    const first = pts[m.pts[0]];
                    if (first) {
                        inspCtx.moveTo(iOffX + first.x * iScale, iOffY + first.y * iScale);

                        for (let i = 1; i < m.pts.length; i++) {
                            const p = pts[m.pts[i]];
                            if (p) {
                                inspCtx.lineTo(iOffX + p.x * iScale, iOffY + p.y * iScale);
                            }
                        }
                        inspCtx.stroke();
                    }
                    inspCtx.shadowBlur = 0;

                    // Draw distance label on the line
                    if (m.pts.length === 2) {
                        const p1 = pts[m.pts[0]];
                        const p2 = pts[m.pts[1]];
                        if (p1 && p2) {
                            const midX = iOffX + (p1.x + p2.x) / 2 * iScale;
                            const midY = iOffY + (p1.y + p2.y) / 2 * iScale;
                            
                            // Calculate distance
                            const dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                            
                            // Draw label background
                            const label = m.displayVal;
                            inspCtx.font = 'bold 12px -apple-system, sans-serif';
                            const textWidth = inspCtx.measureText(label).width;
                            
                            inspCtx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                            inspCtx.beginPath();
                            inspCtx.roundRect(midX - textWidth/2 - 6, midY - 18, textWidth + 12, 22, 6);
                            inspCtx.fill();
                            
                            inspCtx.strokeStyle = lineColor;
                            inspCtx.lineWidth = 1;
                            inspCtx.stroke();
                            
                            // Draw label text
                            inspCtx.fillStyle = '#fff';
                            inspCtx.textAlign = 'center';
                            inspCtx.textBaseline = 'middle';
                            inspCtx.fillText(label, midX, midY - 7);
                        }
                    }
                }

                // Draw points
                if (m.pts) {
                    m.pts.forEach((ptIdx, i) => {
                        const p = pts[ptIdx];
                        if (!p) return;

                        const scrX = iOffX + p.x * iScale;
                        const scrY = iOffY + p.y * iScale;

                        // Outer glow
                        inspCtx.beginPath();
                        inspCtx.arc(scrX, scrY, 10, 0, Math.PI * 2);
                        inspCtx.fillStyle = 'rgba(59, 130, 246, 0.3)';
                        inspCtx.fill();

                        // Point
                        inspCtx.beginPath();
                        inspCtx.arc(scrX, scrY, 6, 0, Math.PI * 2);
                        inspCtx.fillStyle = '#3b82f6';
                        inspCtx.fill();
                        inspCtx.strokeStyle = '#fff';
                        inspCtx.lineWidth = 2;
                        inspCtx.stroke();

                        // Point number
                        inspCtx.fillStyle = '#fff';
                        inspCtx.font = 'bold 10px -apple-system, sans-serif';
                        inspCtx.textAlign = 'center';
                        inspCtx.textBaseline = 'middle';
                        inspCtx.fillText(ptIdx + 1, scrX, scrY);
                    });
                }
            }, 100);
        }

        document.getElementById('btn-close-insp').onclick = () => {
            document.getElementById('inspector-modal').style.display = 'none';
        };

        // ================================================================
        // ==================== HISTORY FUNCTIONALITY ======================
        // ================================================================
        function saveToHistory(score, tier, categories, metrics) {
            try {
                const history = JSON.parse(localStorage.getItem('harm_history') || '[]');
                
                history.push({
                    id: Date.now(),
                    date: new Date().toISOString(),
                    score: score,
                    tier: tier,
                    categories: categories,
                    metrics: metrics.map(m => ({
                        name: m.name,
                        val: m.val,
                        ideal: m.ideal,
                        tier: m.tier,
                        dev: m.dev
                    }))
                });

                // Keep only last 20 entries
                localStorage.setItem('harm_history', JSON.stringify(history.slice(-20)));
            } catch (e) {
                console.warn('Failed to save history:', e);
            }
        }

        function showHistory() {
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('harm_history') || '[]');
            } catch (e) {
                history = [];
            }
            
            const container = document.getElementById('history-container');

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="history-empty">
                        <div class="history-empty-icon">📊</div>
                        <div class="history-empty-text">
                            История пуста.<br>
                            Сделайте первый замер, чтобы начать отслеживать прогресс!
                        </div>
                    </div>
                `;
            } else {
                let html = '';
                const reversed = [...history].reverse();
                
                reversed.forEach((item, idx) => {
                    const date = new Date(item.date);
                    const dateStr = date.toLocaleDateString('ru-RU', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });
                    const timeStr = date.toLocaleTimeString('ru-RU', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Show comparison with previous
                    let comparison = '';
                    if (idx < reversed.length - 1) {
                        const prevScore = reversed[idx + 1].score;
                        const diff = item.score - prevScore;
                        if (diff > 0) {
                            comparison = `<span style="color: #10b981; font-size: 11px;">↑ +${diff}</span>`;
                        } else if (diff < 0) {
                            comparison = `<span style="color: #ef4444; font-size: 11px;">↓ ${diff}</span>`;
                        } else {
                            comparison = `<span style="color: #6b7280; font-size: 11px;">= 0</span>`;
                        }
                    }

                    html += `
                        <div class="history-item" onclick="viewHistoryItem(${item.id})">
                            <div class="history-score-circle">${item.score}</div>
                            <div class="history-info">
                                <div class="history-date">${dateStr} в ${timeStr} ${comparison}</div>
                                <div class="history-tier">${item.tier}</div>
                            </div>
                            <div class="history-arrow">›</div>
                        </div>
                    `;
                });

                // Clear history button
                html += `
                    <button onclick="clearHistory()" style="
                        width: 100%;
                        margin-top: 20px;
                        padding: 14px;
                        background: var(--panel-bg);
                        border: 1px solid var(--panel-border);
                        border-radius: var(--radius-md);
                        color: var(--danger);
                        font-weight: 600;
                        cursor: pointer;
                    ">🗑 Очистить историю</button>
                `;

                container.innerHTML = html;
            }

            document.getElementById('history-modal').style.display = 'block';
        }

        function viewHistoryItem(id) {
            try {
                const history = JSON.parse(localStorage.getItem('harm_history') || '[]');
                const item = history.find(h => h.id === id);
                
                if (item) {
                    toast.show(`Замер от ${new Date(item.date).toLocaleDateString('ru-RU')}: ${item.score} баллов`, 'info', 3000);
                }
            } catch (e) {
                toast.show('Ошибка чтения записи', 'error');
            }
        }

        function clearHistory() {
            if (confirm('Очистить всю историю замеров? Это действие нельзя отменить.')) {
                localStorage.removeItem('harm_history');
                showHistory();
                toast.show('История очищена', 'success');
            }
        }

        document.getElementById('btn-history').onclick = showHistory;
        document.getElementById('btn-close-history').onclick = () => {
            document.getElementById('history-modal').style.display = 'none';
        };

        // ================================================================
        // ================== CANVAS roundRect POLYFILL ====================
        // ================================================================
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // ================================================================
        // ==================== WINDOW RESIZE HANDLER ======================
        // ================================================================
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (img) {
                    fitImage();
                    draw();
                }
            }, 150);
        });

        // ================================================================
        // ===================== INITIALIZE APP ============================
        // ================================================================
        updateUI();
        
        // Welcome toast
        setTimeout(() => {
            toast.show('Добро пожаловать в HARM 49 PRO!', 'info', 3000);
        }, 500);

        // Enable audio on first interaction
        document.addEventListener('click', function enableAudio() {
            sound.init();
            sound.resume();
            document.removeEventListener('click', enableAudio);
        }, { once: true });

    </script>
</body>
